<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000022" />

    <title>Leibinn Consulting — Das moderne Benefit-System für Unternehmen</title>
    <meta
      name="description"
      content="Wir bündeln die wirkungsvollsten Gesundheits- und Vorsorgebenefits in einem System — verwaltungsarm, steuerlich optimiert und flexibel für jedes Teammitglied nutzbar."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Twitter. The previous build shipped bolt.new's default
         placeholder card on every share. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="Leibinn Consulting" />
    <meta property="og:title" content="Das moderne Benefit-System für Unternehmen" />
    <meta
      property="og:description"
      content="Gesundheits- und Vorsorgebenefits in einem System — verwaltungsarm, steuerlich optimiert und flexibel für jedes Teammitglied nutzbar."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Leibinn Consulting" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Das moderne Benefit-System für Unternehmen" />
    <meta
      name="twitter:description"
      content="Gesundheits- und Vorsorgebenefits in einem System — verwaltungsarm, steuerlich optimiert und flexibel für jedes Teammitglied nutzbar."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <!-- Self-hosted webfonts. Hotlinking Google Fonts sends visitor IPs to
         Google, which LG München I (3 O 17493/20) held to be a GDPR breach
         for German sites. See public/fonts/fonts.css. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-tight-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
